name: Squeezelite Clone 9
version: 0.0.22
slug: squeezelite9
description: Squeezelite player for Music Assistant or Lyrion through Home Assistant audio
url: https://github.com/vectorcrumb/ha-addon-squeezelite
startup: services
arch:
  - aarch64
  - amd64
boot: manual
init: false
apparmor: true
audio: true
stage: experimental
options:
  name: Squeezelite
  server: ""
  log_level: info
schema:
  name: str
  server: str
  log_level: list(error|warning|notice|info|debug|trace)
  clientmac: match(^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$)?
